data:
  # Hauptseiten-Navigations-Eintrag
  - locate: '$blocks'
    stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
    skip: 1

  # =========================================================
  # 1. BLÖCKE (id: blocks)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: blocks
    items:
      - locate: 'main'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: '$swords'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: '$armor'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: '$tools'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: '$potions'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: '$utility'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 1

      # Zeile 3: Blöcke
      - stack: GREEN_WOOL;16
        price: 8 of iron
        properties: applycolorbyteam
        row: 3
        column: 1
      - stack: PACKED_ICE;4
        price: 8 of iron
        row: 3
        column: 2
      - stack: GLASS;8
        price: 24 of iron
        row: 3
        column: 3
      - stack: END_STONE;12
        price: 18 of iron
        row: 3
        column: 4
      - stack: OAK_PLANKS;16
        price: 4 of gold
        row: 3
        column: 5
      - stack: IRON_BLOCK;1
        price: 2 of gold
        row: 3
        column: 6
      - stack: LADDER;4
        price: 4 of iron
        row: 3
        column: 7

  # =========================================================
  # 2. WAFFEN & BÖGEN (id: swords)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: swords
    items:
      - locate: '$blocks'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: 'main'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: '$armor'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: '$tools'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: '$potions'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: '$utility'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 2

      # Zeile 3: Nahkampf
      - price: 5 of gold
        row: 3
        column: 1
        stack:
          type: STICK
          display-name: "§aKnockback Stick"
          enchants:
            knockback: 1
      - stack: STONE_SWORD;1
        price: 10 of iron
        row: 3
        column: 2
      - stack: IRON_SWORD;1
        price: 7 of gold
        row: 3
        column: 3
      - stack: DIAMOND_SWORD;1
        price: 3 of emerald
        row: 3
        column: 4

      # Zeile 4: Fernkampf (Bogen -> Power -> Power+Punch -> Pfeile)
      - stack: BOW;1
        price: 12 of gold
        row: 4
        column: 1
      - price: 20 of gold
        row: 4
        column: 2
        stack:
          type: BOW
          enchants:
            power: 1
      - price: 6 of emerald
        row: 4
        column: 3
        stack:
          type: BOW
          enchants:
            power: 1
            punch: 1
      - stack: ARROW;6
        price: 2 of gold
        row: 4
        column: 4

  # =========================================================
  # 3. RÜSTUNG (id: armor)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: armor
    items:
      - locate: '$blocks'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: '$swords'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: 'main'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: '$tools'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: '$potions'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: '$utility'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 3

      # Zeile 3: Rüstungen
      - stack: CHAINMAIL_BOOTS;1
        price: 32 of iron
        row: 3
        column: 1
      - stack: IRON_BOOTS;1
        price: 12 of gold
        row: 3
        column: 2
      - stack: DIAMOND_BOOTS;1
        price: 6 of emerald
        row: 3
        column: 3

  # =========================================================
  # 4. WERKZEUGE (id: tools)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: tools
    items:
      - locate: '$blocks'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: '$swords'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: '$armor'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: 'main'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: '$potions'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: '$utility'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 4

      # Zeile 3: Spitzhacken & Schere
      - stack: WOODEN_PICKAXE;1
        price: 10 of iron
        row: 3
        column: 1
      - stack: STONE_PICKAXE;1
        price: 2 of gold
        row: 3
        column: 2
      - stack: IRON_PICKAXE;1
        price: 10 of gold
        row: 3
        column: 3
      - stack: SHEARS;1
        price: 20 of iron
        row: 3
        column: 4

      # Zeile 4: Äxte
      - stack: WOODEN_AXE;1
        price: 10 of iron
        row: 4
        column: 1
      - stack: STONE_AXE;1
        price: 3 of gold
        row: 4
        column: 2
      - stack: IRON_AXE;1
        price: 10 of gold
        row: 4
        column: 3

  # =========================================================
  # 5. TRÄNKE (id: potions)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: potions
    items:
      - locate: '$blocks'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: '$swords'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: '$armor'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: '$tools'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: 'main'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: '$utility'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 5

      # Zeile 3: Tränke
      - row: 3
        column: 1
        price: 2 of emerald
        stack:
          type: POTION
          display-name: "§fInvisibility"
          effects:
            - effect: invisibility
              duration: 600
              amplifier: 1
      - row: 3
        column: 2
        price: 1 of emerald
        stack:
          type: POTION
          display-name: "§aJump Boost"
          effects:
            - effect: jump_boost
              duration: 900
              amplifier: 5
      - row: 3
        column: 3
        price: 1 of emerald
        stack:
          type: POTION
          display-name: "§bSpeed"
          effects:
            - effect: speed
              duration: 900
              amplifier: 2

  # =========================================================
  # 6. UTILITY / SPEZIELL & EXPLOSIV (id: utility)
  # =========================================================
  - write: false
    stack: 'STONE'
    id: utility
    items:
      - locate: '$blocks'
        stack: WHITE_WOOL;1;§aBlocks;§eClick to view!
        skip: 1
      - locate: '$swords'
        stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!
      - locate: '$armor'
        stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!
      - locate: '$tools'
        stack: STONE_PICKAXE;1;§aTools;§eClick to view!
      - locate: '$potions'
        stack: BREWING_STAND;1;§aPotions;§eClick to view!
      - locate: 'main'
        stack: TNT;1;§aUtility;§eClick to view!
      - stack: GREEN_STAINED_GLASS_PANE;1
        row: 2
        column: 6

      # Zeile 3
      - stack: GOLDEN_APPLE;1
        price: 3 of gold
        row: 3
        column: 1
      - price: 64 of iron
        row: 3
        column: 2
        properties: autoigniteabletnt
        stack:
          type: TNT
      - price: 64 of iron
        row: 3
        column: 3
        properties: "TNTSheep"
        stack:
          type: SHEEP_SPAWN_EGG
          display-name: "§cTNT-Schaf"
      - price: 40 of iron
        row: 3
        column: 4
        properties: "ThrowableFireball"
        stack:
          type: FIRE_CHARGE
          display-name: "§cFeuerball"
      - stack: ENDER_PEARL;1
        price: 4 of emerald
        row: 3
        column: 5
      - price: 10 of gold
        row: 3
        column: 6
        stack:
          type: NAUTILUS_SHELL
          display-name: "§bWindkanone"

      # Zeile 4
      - stack: WIND_CHARGE;1
        price: 3 of gold
        row: 4
        column: 1
      - price: 3 of emerald
        row: 4
        column: 2
        properties: "RescuePlatform"
        stack:
          type: BLAZE_ROD
          display-name: "§aRettungsplattform"
      - price: 6 of gold
        row: 4
        column: 3
        stack:
          type: ENDER_CHEST
          display-name: "§aMobile Teamtruhe"
          lore:
            - "§7Rechtsklick: öffnet die Teamtruhe von überall!"
      - price: 120 of iron
        row: 4
        column: 4
        properties:
          - name: "Golem"
            speed: 0.25
            follow: 16.0
        stack:
          type: GHAST_SPAWN_EGG
          display-name: "§aGolem"
      - price: 1 of emerald
        row: 4
        column: 5
        properties: "BridgeEgg"
        stack:
          type: EGG
          display-name: "§aBrücken-Ei"
      - price: 24 of iron
        row: 4
        column: 6
        properties: "PopupTower"
        stack:
          type: CHEST
          display-name: "§bPopup Tower"

  # =========================================================
  # 7. HAUPTSEITE (QUICKBUY / OVERVIEW)
  # =========================================================
  - locate: '$swords'
    stack: GOLDEN_SWORD;1;§aMelee;§eClick to view!

  - locate: '$armor'
    stack: CHAINMAIL_BOOTS;1;§aArmor;§eClick to view!

  - locate: '$tools'
    stack: STONE_PICKAXE;1;§aTools;§eClick to view!

  - locate: '$potions'
    stack: BREWING_STAND;1;§aPotions;§eClick to view!

  - locate: '$utility'
    stack: TNT;1;§aUtility;§eClick to view!

  # Quickbuy Empfehlungen / Hauptzeilen
  - stack: STONE_SWORD;1
    price: 10 of iron
    row: 3
    column: 1

  - stack: WOODEN_PICKAXE;1
    price: 10 of iron
    row: 3
    column: 2

  - stack: WOODEN_AXE;1
    price: 10 of iron
    row: 3
    column: 3

  - stack: SHEARS;1
    price: 20 of iron
    row: 3
    column: 4

  - stack: GREEN_WOOL;16
    properties: applycolorbyteam
    price: 8 of iron
    row: 3
    column: 5

  - stack: OAK_PLANKS;16
    price: 4 of gold
    row: 3
    column: 6

  - stack: GLASS;8
    price: 24 of iron
    row: 3
    column: 7

  # Feste Quickbuy-Zeile 4 (echte Shop-Einträge, Spezial-Items funktionieren hier vollständig)
  - stack: CHAINMAIL_BOOTS;1
    price: 32 of iron
    row: 4
    column: 1

  - stack: IRON_SWORD;1
    price: 7 of gold
    row: 4
    column: 2

  - stack: BOW;1
    price: 12 of gold
    row: 4
    column: 3

  - stack: ARROW;6
    price: 2 of gold
    row: 4
    column: 4

  - stack: TNT;1
    price: 64 of iron
    properties: autoigniteabletnt
    row: 4
    column: 5

  - price: 40 of iron
    properties: "ThrowableFireball"
    row: 4
    column: 6
    stack:
      type: FIRE_CHARGE
      display-name: "§cFeuerball"

  - stack: ENDER_PEARL;1
    price: 4 of emerald
    row: 4
    column: 7

  # Anpassbare Quickshop-Slots (Reihe 5 + 6, 14 Stück): Rechtsklick auf den Slot, dann ein Item anklicken.
  # (Spezial-Items sind hier nicht möglich, dafür gibt es die festen Einträge in Reihe 3 und 4.)
  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 1
    row: 5
    column: 1

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 2
    row: 5
    column: 2

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 3
    row: 5
    column: 3

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 4
    row: 5
    column: 4

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 5
    row: 5
    column: 5

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 6
    row: 5
    column: 6

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 7
    row: 5
    column: 7

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 8
    row: 6
    column: 1

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 9
    row: 6
    column: 2

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 10
    row: 6
    column: 3

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 11
    row: 6
    column: 4

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 12
    row: 6
    column: 5

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 13
    row: 6
    column: 6

  - stack: "RED_STAINED_GLASS_PANE;1"
    price: 1 of iron
    lore:
      - "§cLeerer Quickbuy-Slot"
      - "§7Rechtsklick (oder Shift+Rechtsklick), danach"
      - "§7ein Item in einer Kategorie anklicken."
    properties:
      name: "quickbuy"
      id: 14
    row: 6
    column: 7

  # Indikator-Glas für die Hauptseite
  - stack: GREEN_STAINED_GLASS_PANE;1
    row: 2
    column: 0
